name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:css
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run check:entry
      # Pin is deliberate: an unpinned @latest warning can turn main red with
      # zero repo changes. doctor.config.json ignores grok-github-fast.html.
      # --blocking warning keeps the 100/100 score a gate rather than a log line.
      - run: npx -y react-doctor@0.9.12 --verbose --blocking warning

  react-doctor-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: npx -y react-doctor@latest --verbose
