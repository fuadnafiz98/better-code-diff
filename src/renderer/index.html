<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0d0f" />
    <title>Horus</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; background: #0c0d0f; }
      html[data-horus-theme="light"], html[data-horus-theme="light"] body, html[data-horus-theme="light"] #root { background: #f7f8fa; }
      html[data-horus-theme="dark"], html[data-horus-theme="dark"] body, html[data-horus-theme="dark"] #root { background: #0c0d0f; }
      @media (prefers-color-scheme: light) {
        html:not([data-horus-theme]) body, html:not([data-horus-theme]) #root { background: #f7f8fa; }
      }
      .boot-drag { height: 40px; -webkit-app-region: drag; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-drag"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
